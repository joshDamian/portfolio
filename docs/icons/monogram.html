<!doctype html>
<!-- Source for the site icons. Screenshot #a (512px, rounded) for favicon-32.png
     and the 32/48px entries of favicon.ico, #a16 (heavier stroke) for the 16px
     entry, and #apple (square; iOS rounds it) for apple-touch-icon.png at 180px.
     #b / #b16 are the sky-blue alternative that was not used. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{margin:0}body{display:flex;flex-wrap:wrap;width:1536px}
.t{width:512px;height:512px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:400 470px/1 "Instrument Serif",serif;letter-spacing:-.05em;padding:0 0 26px 0;box-sizing:border-box;border-radius:112px}
.dark{background:#0c2230;color:#87ceeb}
.sky{background:#87ceeb;color:#0c2230}
.s1{-webkit-text-stroke:7px currentColor}
.s2{-webkit-text-stroke:20px currentColor;letter-spacing:-.02em}
</style></head><body>
<div class="t dark s1" id="a">JA</div><div class="t dark s1" id="apple" style="border-radius:0">JA</div><div class="t sky s1" id="b">JA</div><div class="t dark s2" id="a16">JA</div><div class="t sky s2" id="b16">JA</div>
</body></html>
