<!doctype html>
<!-- Source for public/og.jpg (the 1200x630 social share card). Open in a
     browser at 1200x630, screenshot, save as JPEG ~q86. See docs/og/README.md. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:radial-gradient(120% 90% at 15% 0%,#d4ecf7 0,#f2f8fb 55%);font-family:Geist,sans-serif;color:#0c2230;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(12,34,48,.09) 1.2px,transparent 1.5px);background-size:26px 26px}
.text{position:absolute;left:96px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:500 22px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#1d6c96}
h1{font:400 112px/1 "Instrument Serif",serif;letter-spacing:-.01em;margin-top:22px}
p{font-size:31px;line-height:1.4;color:#2b4656;margin-top:30px;max-width:560px}
.url{position:absolute;left:96px;bottom:52px;font:400 21px "IBM Plex Mono",monospace;color:#4f6878;letter-spacing:.04em}
.pol{position:absolute;right:100px;top:92px;width:330px;padding:16px 16px 0;background:#fbfcf9;border-radius:8px;transform:rotate(-4deg);
 box-shadow:0 30px 50px -24px rgba(18,52,74,.5),0 6px 14px -6px rgba(18,52,74,.25)}
.pol img{display:block;width:100%;aspect-ratio:1;border-radius:3px;object-fit:cover}
.pol figcaption{font:italic 400 32px "Instrument Serif",serif;text-align:center;padding:12px 0 16px;color:#2b4656}
.tape{position:absolute;left:50%;top:-18px;width:130px;height:38px;margin-left:-65px;background:rgba(135,206,235,.65);transform:rotate(3deg)}
</style></head><body>
<div class="text"><span class="eyebrow">Software developer</span><h1>Joshua Avoaja</h1>
<p>Co-founder &amp; CTO at UseAzza, building a stablecoin bank for everyday people.</p></div>

<figure class="pol"><span class="tape"></span><img src="../../src/images/josh.jpg" alt=""><figcaption>that&rsquo;s me</figcaption></figure>
</body></html>
