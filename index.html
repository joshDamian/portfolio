    <!--
      v2 display + UI faces. v1 renders from Poppins, imported in src/index.css.
      Preconnects open the TLS handshake while the stylesheet is still being
      parsed; the axis ranges are pinned so Google serves two files instead of
      the full variable font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <title>Joshua Avoaja</title>
  </head>
  <body style="background-color: black">
    <!--
      Hidden registration copy: Netlify's build bot discovers forms in the
      static HTML, so this is what makes the "contact" form exist. The React
      form POSTs a matching body (see src/utils/contact.js). bot-field is the
      honeypot named below — it has to exist here or netlify-honeypot names a
      field that is not there.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
